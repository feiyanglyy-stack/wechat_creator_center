<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    background: #0a0a0c;
    position: relative;
    color: #f3f4f6;
  }
  /* 背景光晕：珊瑚 + 青，呼应应用主题色 */
  .glow {
    position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.55;
  }
  .glow-coral { width: 620px; height: 620px; background: #f97316; top: -220px; left: -160px; opacity: 0.30; }
  .glow-cyan  { width: 560px; height: 560px; background: #06b6d4; bottom: -260px; right: 240px; opacity: 0.22; }
  .grid {
    position: absolute; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(ellipse 80% 70% at 30% 40%, #000 30%, transparent 75%);
  }
  .wrap { position: relative; height: 100%; display: flex; align-items: center; padding: 0 72px; gap: 56px; }
  .left { flex: 1; }
  .badge {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 17px; color: #fbbf24; font-weight: 600;
    border: 1px solid rgba(251,191,36,0.35); background: rgba(251,191,36,0.08);
    padding: 7px 16px; border-radius: 999px; margin-bottom: 26px; letter-spacing: 0.5px;
  }
  h1 {
    font-size: 76px; line-height: 1.05; font-weight: 800; letter-spacing: -1px;
    background: linear-gradient(135deg, #f3f4f6 28%, #f97316 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    margin-bottom: 8px;
  }
  .en { font-size: 30px; font-weight: 600; color: #9ca3af; letter-spacing: 0.5px; margin-bottom: 26px; }
  .tagline { font-size: 25px; color: #d1d5db; line-height: 1.5; margin-bottom: 30px; max-width: 640px; }
  .chips { display: flex; flex-wrap: wrap; gap: 12px; }
  .chip {
    font-size: 19px; color: #f3f4f6; background: rgba(22,22,30,0.8);
    border: 1px solid rgba(255,255,255,0.10); padding: 9px 18px; border-radius: 12px;
  }
  .chip b { color: #06b6d4; font-weight: 700; }
  .foot {
    position: absolute; bottom: 40px; left: 72px;
    font-size: 19px; color: #6b7280; display: flex; gap: 18px; align-items: center;
  }
  .foot .pill { color: #9ca3af; border: 1px solid rgba(255,255,255,0.10); padding: 4px 12px; border-radius: 8px; }

  /* 右侧：微信预览手机模型 */
  .phone {
    width: 320px; height: 540px; border-radius: 38px; flex-shrink: 0;
    background: #16161e; border: 1px solid rgba(255,255,255,0.10);
    box-shadow: 0 30px 80px rgba(0,0,0,0.55), 0 0 0 8px rgba(255,255,255,0.02);
    padding: 18px 18px; position: relative; transform: rotate(3deg);
  }
  .notch { width: 120px; height: 22px; background: #0a0a0c; border-radius: 0 0 14px 14px; margin: -18px auto 14px; }
  .screen { background: #fff; border-radius: 22px; height: 470px; padding: 20px 18px; overflow: hidden; color: #222; }
  .a-title { font-size: 18px; font-weight: 800; color: #111; line-height: 1.35; margin-bottom: 10px; }
  .a-meta { font-size: 11px; color: #888; margin-bottom: 14px; }
  .a-meta .acc { color: #576b95; }
  .a-cover { height: 90px; border-radius: 8px; background: linear-gradient(135deg, #f97316, #fbbf24 60%, #06b6d4); margin-bottom: 12px; }
  .a-h2 { font-size: 13px; font-weight: 700; color: #111; border-bottom: 2px solid #f97316; padding-bottom: 3px; margin: 0 0 8px; display: inline-block; }
  .a-line { height: 8px; border-radius: 4px; background: #ececec; margin-bottom: 7px; }
  .a-line.s { width: 70%; }
  .a-quote { border-left: 4px solid #f97316; background: #fff7ed; border-radius: 0 6px 6px 0; padding: 9px 10px; margin-top: 10px; }
  .a-quote .q { height: 7px; border-radius: 4px; background: #fed7aa; margin-bottom: 6px; }
  .a-quote .q.s { width: 60%; margin-bottom: 0; }
</style>
</head>
<body>
  <div class="glow glow-coral"></div>
  <div class="glow glow-cyan"></div>
  <div class="grid"></div>

  <div class="wrap">
    <div class="left">
      <div class="badge">🦊 开源 · MIT · 本地运行</div>
      <h1>谋士智能创作中心</h1>
      <div class="en">WeChat Creator Center</div>
      <div class="tagline">微信公众号图文排版的桌面工具：实时移动端预览 · 段落卡片编辑 · AI 写作助手 · 一键推送草稿箱。</div>
      <div class="chips">
        <div class="chip">📱 <b>实时预览</b></div>
        <div class="chip">📖 <b>段落编辑</b></div>
        <div class="chip">🤖 <b>AI 助手</b></div>
        <div class="chip">🚀 <b>一键推草稿</b></div>
      </div>
    </div>

    <div class="phone">
      <div class="notch"></div>
      <div class="screen">
        <div class="a-title">Pydantic V3 暴涨 20 倍性能，数据工作流迎来"骨架重塑"？</div>
        <div class="a-meta">2026-05-30 · 作者名 · <span class="acc">我的公众号</span></div>
        <div class="a-cover"></div>
        <div class="a-h2">一、类型炼金 — Rust 铁骨</div>
        <div class="a-line"></div>
        <div class="a-line"></div>
        <div class="a-line s"></div>
        <div class="a-quote">
          <div class="q"></div>
          <div class="q s"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="foot">
    <span class="pill">HTML · CSS · JS + Python</span>
    <span>github.com/feiyanglyy-stack/wechat_creator_center</span>
  </div>
</body>
</html>
